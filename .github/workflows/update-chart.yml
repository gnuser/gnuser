name: Update monthly activity
on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_chart.py
      - .github/workflows/update-chart.yml
permissions:
  contents: write
concurrency:
  group: monthly-activity
  cancel-in-progress: false
jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate chart
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOWED_REPOSITORIES: ${{ secrets.PROFILE_STATS_REPOSITORIES }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'GitHub Actions token is required.'
            exit 1
          fi
          python3 scripts/generate_chart.py
      - name: Save chart
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/monthly-activity.svg assets/monthly-activity.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update monthly activity chart'
          git push
